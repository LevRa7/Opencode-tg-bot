<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OpenCode - Login</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #1E1F22;
      color: #DFE1E5;
      display: flex; align-items: center; justify-content: center;
      min-height: 100vh;
    }
    .login-box {
      background: #2B2D30;
      padding: 32px;
      border-radius: 12px;
      width: 100%;
      max-width: 360px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.3);
    }
    h1 { font-size: 20px; margin-bottom: 8px; text-align: center; }
    p { font-size: 13px; color: #9DA1A7; margin-bottom: 24px; text-align: center; }
    label { font-size: 13px; color: #9DA1A7; display: block; margin-bottom: 4px; }
    input {
      width: 100%; padding: 10px 12px; background: #1E1F22;
      border: 1px solid #3E4045; border-radius: 8px; color: #DFE1E5;
      font-size: 14px; margin-bottom: 16px; outline: none;
    }
    input:focus { border-color: #6C6F75; }
    button {
      width: 100%; padding: 10px; background: #3574F0;
      border: none; border-radius: 8px; color: white;
      font-size: 14px; font-weight: 500; cursor: pointer;
    }
    button:hover { background: #2E6AE0; }
    .error { color: #F56C6C; font-size: 13px; margin-bottom: 12px; text-align: center; display: none; }
  </style>
</head>
<body>
  <div class="login-box">
    <h1>OpenCode</h1>
    <p>Enter password to access the web panel</p>
    <div class="error" id="error">Invalid password</div>
    <form id="loginForm">
      <label for="password">Password</label>
      <input type="password" id="password" placeholder="Enter your password" required autofocus>
      <button type="submit">Login</button>
    </form>
  </div>
  <script>
    document.getElementById('loginForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      const password = document.getElementById('password').value;
      try {
        const resp = await fetch('/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password })
        });
        if (resp.ok) {
          window.location.href = '/';
        } else {
          document.getElementById('error').style.display = 'block';
        }
      } catch (err) {
        document.getElementById('error').style.display = 'block';
      }
    });
  </script>
</body>
</html>
