[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=%(ENV_SUPERVISORD_RUNTIME_DIR)s/supervisord.pid
childlogdir=%(ENV_SUPERVISORD_RUNTIME_DIR)s

[unix_http_server]
file=%(ENV_SUPERVISORD_RUNTIME_DIR)s/supervisor.sock
chmod=0700

[supervisorctl]
serverurl=unix://%(ENV_SUPERVISORD_RUNTIME_DIR)s/supervisor.sock

[program:opencode-runtime]
command=/bin/sh -lc "${OPENCODE_SERVER_COMMAND:-opencode serve --hostname 0.0.0.0 --port 4096}"
directory=%(ENV_OPENCODE_WORKSPACE)s
autorestart=true
startsecs=2
stopsignal=TERM
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
priority=10

[program:tg-cli-daemon]
command=/bin/sh -lc "${TG_CLI_DAEMON_COMMAND:-python3 -m tg_cli.daemon.http_server}"
directory=%(ENV_OPENCODE_WORKSPACE)s
autorestart=true
startsecs=2
stopsignal=TERM
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
priority=20
